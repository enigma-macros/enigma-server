<style>
:root{--bg:#110d08;--card:#1f1810;--line:#33281a;--text:#f6ecdc;--muted:#a8967c;--accent:#f5a524;--accent2:#ff7a2f;--ok:#2fa84f;--bad:#e5604d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;padding:20px}
.wrap{max-width:1050px;margin:0 auto}
h1{margin:0 0 4px;font-size:26px}h2{font-size:18px;margin:0 0 12px}
.meta{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:16px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
button,select,input{font:inherit;border-radius:8px;border:1px solid var(--line);background:#2c2114;color:var(--text);padding:6px 12px}
button{cursor:pointer}button.go{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a1000;border:0;font-weight:700}
button.no{border-color:var(--bad);color:var(--bad)}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--accent);font-weight:600}
code{background:#2c2114;padding:2px 6px;border-radius:6px}
.empty{color:var(--muted);padding:6px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#f6ecdc;color:#110d08;padding:10px 18px;border-radius:12px;z-index:9}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="wrap">
<h1>Enigma admin</h1>
<p class="meta">Before approving, open your bank / UPI app and check that a payment of the same amount with the same UTR really arrived. <a href="/" style="color:var(--accent)">Back to site</a></p>

<div class="card"><h2>Pending payments <span class="meta" id="pcount"></span></h2><div id="pending"></div></div>

<div class="card"><h2>Give a plan manually</h2>
<form id="grant"><input id="gid" placeholder="Discord user ID" size="24" inputmode="numeric" required>
<select id="gplan"><option value="d7">7 Days</option><option value="d30">30 Days</option><option value="life">Lifetime</option></select>
<button class="go">Give plan</button></form>
<p class="meta" id="gmsg" style="margin:8px 0 0">Use this for friends, giveaways or payments you verified outside the site.</p></div>

<div class="card"><h2>Licenses</h2><div id="licenses"></div></div>
<div class="card"><h2>Recent decisions</h2><div id="recent"></div></div>
</div>
<div class="toast" id="toast" hidden></div>
<script>
var q=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var inr=function(n){return "₹"+Number(n).toLocaleString("en-IN")};
var fd=function(t){return t?new Date(t*1000).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-"};
var tt;function toast(m){var t=q("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},4000)}
async function api(p,body){
  var o={method:body===undefined?"GET":"POST",headers:{"X-Requested-With":"enigma"},credentials:"same-origin"};
  if(body!==undefined){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body)}
  var r=await fetch(p,o),j=null;try{j=await r.json()}catch(e){}
  if(!r.ok||(j&&j.ok===false))throw new Error((j&&j.error)||"Request failed");return j}
function table(head,rows){return rows.length?"<table><tr>"+head.map(function(h){return"<th>"+h+"</th>"}).join("")+"</tr>"+rows.join("")+"</table>":'<div class="empty">Nothing here yet.</div>'}
function who(o){return esc(o.username||"unknown")+' <span class="meta">('+esc(o.discord_id)+")</span>"}
async function load(){
  var d=await api("/api/admin/overview");
  q("#pcount").textContent=d.pending.length?"("+d.pending.length+")":"";
  q("#pending").innerHTML=table(["Order","User","Plan","Amount","UTR","Submitted",""],d.pending.map(function(o){
    return"<tr><td>#"+o.id+"</td><td>"+who(o)+"</td><td>"+esc(o.planName)+"</td><td><b>"+inr(o.amount)+"</b></td><td><code>"+esc(o.utr)+"</code></td><td>"+fd(o.created_at)+
    '</td><td><button class="go" data-a="approve" data-id="'+o.id+'">Approve</button> <button class="no" data-a="reject" data-id="'+o.id+'">Reject</button></td></tr>'}));
  q("#licenses").innerHTML=table(["User","Plan","Status","Expires","Key","PC",""],d.licenses.map(function(l){
    var cls=l.status==="active"?"ok":"bad";
    return"<tr><td>"+who(l)+"</td><td>"+esc(l.planName)+'</td><td class="'+cls+'">'+esc(l.status)+"</td><td>"+(l.expires_at===null?"Lifetime":fd(l.expires_at))+"</td><td><code>"+esc(l.key)+"</code></td><td>"+(l.hwid_bound?"bound":"free")+
    '</td><td><button data-a="hwid" data-d="'+esc(l.discord_id)+'">Reset PC</button> '+(l.status==="revoked"?'<button data-a="unrevoke" data-d="'+esc(l.discord_id)+'">Restore</button>':'<button class="no" data-a="revoke" data-d="'+esc(l.discord_id)+'">Revoke</button>')+"</td></tr>"}));
  q("#recent").innerHTML=table(["Order","User","Plan","Amount","UTR","Result","When"],d.recent.map(function(o){
    return"<tr><td>#"+o.id+"</td><td>"+who(o)+"</td><td>"+esc(o.planName)+"</td><td>"+inr(o.amount)+"</td><td><code>"+esc(o.utr||"manual")+'</code></td><td class="'+(o.status==="approved"?"ok":"bad")+'">'+esc(o.status)+"</td><td>"+fd(o.decided_at)+"</td></tr>"}));
}
document.addEventListener("click",async function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;var a=b.dataset.a;
  try{
    if(a==="approve"){if(!confirm("Approve order #"+b.dataset.id+"? Only do this after you saw the payment in your bank/UPI app."))return;await api("/api/admin/orders/"+b.dataset.id+"/approve",{});toast("Approved. License is live.")}
    else if(a==="reject"){var n=prompt("Reason (optional)","");if(n===null)return;await api("/api/admin/orders/"+b.dataset.id+"/reject",{note:n});toast("Rejected.")}
    else if(a==="revoke"){if(!confirm("Revoke this license? The client stops working at its next check."))return;await api("/api/admin/revoke",{discord_id:b.dataset.d});toast("Revoked.")}
    else if(a==="unrevoke"){await api("/api/admin/revoke",{discord_id:b.dataset.d,undo:true});toast("Restored.")}
    else if(a==="hwid"){await api("/api/admin/hwid-reset",{discord_id:b.dataset.d});toast("PC binding cleared.")}
    await load();
  }catch(er){toast(er.message)}
});
q("#grant").addEventListener("submit",async function(e){
  e.preventDefault();
  try{var r=await api("/api/admin/grant",{discord_id:q("#gid").value.trim(),plan:q("#gplan").value});q("#gmsg").textContent="Done. License key: "+r.key;q("#gid").value="";await load()}catch(er){toast(er.message)}
});
load().catch(function(e){toast(e.message)});
setInterval(function(){load().catch(function(){})},30000);
</script>
</body>
</html>
